name: Browser

# The import, for real: a fresh Joomla, the package installed through Joomla's
# CLI, and Cypress pressing the button - which downloads the help repository
# from GitHub, converts every page and builds the menu. Nothing else here runs
# Joomla's article, category and menu models, so nothing else can say whether
# the pages arrive.
#
# A separate workflow because it is the slow one, and because it can fail for
# reasons that are about the network rather than the code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: joomla
          MYSQL_DATABASE: joomla_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pjoomla"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      JOOMLA_VERSION: 6.1.3
      SITE_URL: http://127.0.0.1:8080
      # A Super User for this run only. Joomla requires twelve characters.
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password-for-one-run

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mysqli, pdo_mysql, intl, gd, mbstring, simplexml, curl
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Cypress
        run: npm ci

      - name: Fetch Joomla
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla

      - name: Install Joomla
        run: |
          php joomla/installation/joomla.php install \
            --site-name="MD Import CI" \
            --admin-user="CI" \
            --admin-username="${ADMIN_USERNAME}" \
            --admin-password="${ADMIN_PASSWORD}" \
            --admin-email="ci@example.invalid" \
            --db-type=mysqli \
            --db-host=127.0.0.1 \
            --db-user=root \
            --db-pass=joomla \
            --db-name=joomla_ci \
            --db-prefix=ci_ \
            --no-interaction

      # Under PHP's built-in server Joomla works out its root wrongly from an
      # /administrator request; $live_site is the override for exactly this.
      - name: Tell Joomla where it lives
        run: |
          sed -i "s|public \$live_site = '';|public \$live_site = '${SITE_URL}';|" joomla/configuration.php
          sed -i "s|public \$debug = false;|public \$debug = true;|" joomla/configuration.php
          grep -q "live_site = '${SITE_URL}'" joomla/configuration.php

      # Workers: a single-threaded server deadlocks when a page asks the site
      # for a second thing while the first is being served.
      - name: Serve the site
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -d display_errors=stderr -d max_execution_time=300 -d memory_limit=512M -S 127.0.0.1:8080 -t joomla > php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null "${SITE_URL}/administrator/"; then
              echo "serving after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the site never came up"
          cat php-server.log
          exit 1

      - name: Point Cypress at it
        run: |
          cat > cypress.env.json <<JSON
          {
            "baseUrl": "${SITE_URL}",
            "adminUser": "${ADMIN_USERNAME}",
            "adminPassword": "${ADMIN_PASSWORD}"
          }
          JSON

      - name: Install the package
        run: composer install-local

      # A fresh Joomla starts a guided tour and asks about statistics: both
      # put something over the page under test.
      - name: Quieten a fresh Joomla
        run: |
          mysql -h 127.0.0.1 -uroot -pjoomla joomla_ci -e "UPDATE ci_extensions SET enabled = 0 WHERE type = 'plugin' AND element IN ('guidedtours', 'stats');"

      - name: Seed a menu heading to import under
        run: php tools/seed-site.php

      - name: Browser tests
        run: npx cypress run

      - name: What it saw when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: What Joomla and the server logged
        if: failure()
        run: |
          grep -ahE 'CRITICAL|ERROR' joomla/administrator/logs/*.php | cut -c1-2000 | head -40 || true
          echo '--- server ---'
          grep -inE 'fatal|uncaught|exception|error|warning|\[500\]' php-server.log | head -50 || true
