name: Release

# Pushing a tag is the whole release procedure: bump the version in the three
# manifests, run `composer update-xml`, commit, and push a tag `v<version>`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: The tag must match the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(php -r 'echo trim((string) simplexml_load_file("src/pkg_mdimport.xml")->version);')
          echo "tag: $TAG   manifest: $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $MANIFEST. Bump src/pkg_mdimport.xml, or tag the version it already carries."
            exit 1
          fi

      # updates.xml is generated; the check is that regenerating changes nothing.
      - name: The update server must be current
        run: |
          php build/update-xml.php
          if ! git diff --quiet; then
            echo "::error::updates.xml is out of date. Run php build/update-xml.php, commit the result, and re-tag."
            git --no-pager diff
            exit 1
          fi

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Fetch Joomla for static analysis
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla
        env:
          JOOMLA_VERSION: 6.1.3

      - name: Unit tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs

      - name: Build the package
        run: php build/build.php

      # The package is what people install, so its contents are asserted once
      # rather than the build script being trusted forever.
      - name: The package must hold the component and a library with CommonMark in it
        run: |
          php -r '
            $zip = new ZipArchive();
            $zip->open(glob("build/pkg_mdimport-*.zip")[0]);
            foreach (["pkg_mdimport.xml", "script.php", "packages/com_mdimport.zip", "packages/lib_yepr_commonmark.zip"] as $required) {
                if ($zip->locateName($required) === false) { fwrite(STDERR, "Package has no {$required}.\n"); exit(1); }
            }
            $lib = new ZipArchive();
            file_put_contents("lib.zip", $zip->getFromName("packages/lib_yepr_commonmark.zip"));
            $lib->open("lib.zip");
            foreach (["yepr_commonmark.xml", "autoload.php", "vendor/autoload.php", "vendor/league/commonmark/src/MarkdownConverter.php"] as $required) {
                if ($lib->locateName($required) === false) { fwrite(STDERR, "Library has no {$required}.\n"); exit(1); }
            }
            for ($i = 0; $i < $lib->numFiles; $i++) {
                if (str_contains($lib->getNameIndex($i), "\\")) { fwrite(STDERR, "Backslash in " . $lib->getNameIndex($i) . "\n"); exit(1); }
            }
            echo "package and library hold what they must\n";
          '
          rm -f lib.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/pkg_mdimport-*.zip \
            --title "MD Import $GITHUB_REF_NAME" \
            --generate-notes

      # Joomla checks a downloaded update against the checksum in updates.xml.
      # Only this run can write it: the archive was built here. It is committed
      # to main once the release exists, so a site is never told to expect a
      # file that is not there yet.
      - name: Write the checksum into updates.xml on main
        run: |
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          MAIN=$(php -r 'echo trim((string) simplexml_load_file("src/pkg_mdimport.xml")->version);')
          if [ "v$MAIN" != "$GITHUB_REF_NAME" ]; then
            echo "::warning::main is at $MAIN by now, not $GITHUB_REF_NAME, so the checksum of this release was not written."
            exit 0
          fi
          php build/update-xml.php --checksum
          if git diff --quiet -- updates.xml; then
            echo "updates.xml on main already carries this checksum."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates.xml
          git commit -m "Checksum for the $GITHUB_REF_NAME download"
          git push origin main
