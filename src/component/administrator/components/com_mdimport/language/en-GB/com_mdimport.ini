COM_MDIMPORT="MD Import"
COM_MDIMPORT_CONFIGURATION="MD Import: Options"
COM_MDIMPORT_XML_DESCRIPTION="Imports the Joomla help pages from Jdocmanual (Markdown on GitHub) as articles, images and menu items, converting with league/commonmark."

COM_MDIMPORT_ACTION_IMPORT="Import"
COM_MDIMPORT_ACTION_IMPORT_DESC="Allows users in the group to run the import, which creates and updates articles, categories, menu items and images."

; Options: target
COM_MDIMPORT_FIELDSET_TARGET="Import"
COM_MDIMPORT_FIELDSET_TARGET_DESC="Where the help pages go on this site."
COM_MDIMPORT_FIELD_PARENT_MENU_ITEM_LABEL="Parent Menu Item"
COM_MDIMPORT_FIELD_PARENT_MENU_ITEM_DESC="The existing menu item the new menu items are created under. They go in the same menu. A Menu Heading made for the purpose works well."
COM_MDIMPORT_OPTION_SELECT_MENU_ITEM="- Select a menu item -"
COM_MDIMPORT_FIELD_SECTION_MENU_TYPE_LABEL="Section Menu Items"
COM_MDIMPORT_FIELD_SECTION_MENU_TYPE_DESC="What each section of the manual (Articles, Banners, …) becomes in the menu. A category list or blog needs Section Categories switched on; without them sections are headings."
COM_MDIMPORT_OPTION_SECTION_HEADING="Menu Heading"
COM_MDIMPORT_OPTION_SECTION_CATEGORY_LIST="Category List"
COM_MDIMPORT_OPTION_SECTION_CATEGORY_BLOG="Category Blog"
COM_MDIMPORT_FIELD_IMAGES_FOLDER_LABEL="Images Folder"
COM_MDIMPORT_FIELD_IMAGES_FOLDER_DESC="The existing folder under images/ the screenshots are copied into."
COM_MDIMPORT_OPTION_IMAGES_ROOT="images (the top folder)"
COM_MDIMPORT_FIELD_IMAGES_SUBFOLDER_LABEL="Subfolder"
COM_MDIMPORT_FIELD_IMAGES_SUBFOLDER_DESC="A folder made inside the Images Folder to hold the import, so its 40-odd section folders do not land between your own. Leave empty to copy straight into the Images Folder."
COM_MDIMPORT_FIELD_PARENT_CATEGORY_LABEL="Category"
COM_MDIMPORT_FIELD_PARENT_CATEGORY_DESC="The article category the help pages go into. By default a category called Help is made at the top."
COM_MDIMPORT_OPTION_CREATE_HELP_CATEGORY="- Make a category called Help -"
COM_MDIMPORT_FIELD_SECTION_CATEGORIES_LABEL="Section Categories"
COM_MDIMPORT_FIELD_SECTION_CATEGORIES_DESC="Make a subcategory for every section of the manual, and put each page in its section's category."
COM_MDIMPORT_FIELD_PUBLISHED_LABEL="Status"
COM_MDIMPORT_FIELD_PUBLISHED_DESC="The status new articles and menu items get."
COM_MDIMPORT_FIELD_ON_EXISTING_LABEL="Imported Before"
COM_MDIMPORT_FIELD_ON_EXISTING_DESC="What happens to pages imported before. Update writes the current text of the manual into them (an article whose text has not changed is not saved again). Skip leaves them as they are and only adds what is new."
COM_MDIMPORT_OPTION_UPDATE="Update"
COM_MDIMPORT_OPTION_SKIP="Skip"
COM_MDIMPORT_FIELD_ATTRIBUTION_LABEL="Source Line"
COM_MDIMPORT_FIELD_ATTRIBUTION_DESC="End every article with a line naming the online page it was imported from and its licence."

; Options: source
COM_MDIMPORT_FIELDSET_SOURCE="Source"
COM_MDIMPORT_FIELDSET_SOURCE_DESC="The GitHub repository the help pages are read from. It is downloaded as one archive from GitHub's public download server: no GitHub account or token is needed. Other languages of the same manual are in repositories named cefjdemos-data-jdm-help-de, -fr, -nl and so on."
COM_MDIMPORT_FIELD_SOURCE_OWNER_LABEL="Owner"
COM_MDIMPORT_FIELD_SOURCE_REPOSITORY_LABEL="Repository"
COM_MDIMPORT_FIELD_SOURCE_REPOSITORY_DESC="A Jdocmanual data repository: one with menu.json, folders.json, articles/ and images/."
COM_MDIMPORT_FIELD_SOURCE_BRANCH_LABEL="Branch or Tag"

; Options: links
COM_MDIMPORT_FIELDSET_LINKS="Links"
COM_MDIMPORT_FIELDSET_LINKS_DESC="Where links go that do not point at an imported page. A link keeps everything after the manual's name: jdocmanual?article=user/articles/x goes to the User Guide address followed by articles/x."
COM_MDIMPORT_FIELD_USER_GUIDE_URL_LABEL="User Guide"
COM_MDIMPORT_FIELD_USER_GUIDE_URL_DESC="Where links to the User Manual (jdocmanual?article=user/…) go. Starting with / means the root of this site. Leave empty to link to the online Jdocmanual."
COM_MDIMPORT_FIELD_HELP_PAGES_URL_LABEL="Help Pages"
COM_MDIMPORT_FIELD_HELP_PAGES_URL_DESC="Where links to a help page that is not in this import (jdocmanual?article=help/…) go. Links to imported pages always go to their article. Leave empty to link to the online Jdocmanual."
COM_MDIMPORT_FIELD_SOURCE_URL_LABEL="Source Line Address"
COM_MDIMPORT_FIELD_SOURCE_URL_DESC="Where the help pages are published. The source line at the end of each article links to this address followed by the page's section and name, e.g. articles/articles."
COM_MDIMPORT_FIELD_MANUAL_BASE_LABEL="Online Jdocmanual"
COM_MDIMPORT_FIELD_MANUAL_BASE_DESC="The online Jdocmanual, for links into a manual that has no address of its own above."

; Options: conversion
COM_MDIMPORT_FIELDSET_CONVERSION="Markdown"
COM_MDIMPORT_FIELDSET_CONVERSION_DESC="How the Markdown is converted to HTML, with league/commonmark."
COM_MDIMPORT_FIELD_MD_FLAVOR_LABEL="Flavour"
COM_MDIMPORT_FIELD_MD_FLAVOR_DESC="GitHub-Flavoured Markdown adds tables, strikethrough, autolinks and task lists to CommonMark. The help pages use tables."
COM_MDIMPORT_OPTION_FLAVOR_GFM="GitHub-Flavoured Markdown"
COM_MDIMPORT_OPTION_FLAVOR_COMMONMARK="CommonMark"
COM_MDIMPORT_FIELD_MD_HTML_INPUT_LABEL="HTML Input"
COM_MDIMPORT_FIELD_MD_HTML_INPUT_DESC="What to do with HTML written in the Markdown. The help pages use some (alert boxes, icons), so Allow keeps them as they look online."
COM_MDIMPORT_OPTION_HTML_ALLOW="Allow"
COM_MDIMPORT_OPTION_HTML_ESCAPE="Escape"
COM_MDIMPORT_OPTION_HTML_STRIP="Strip"
COM_MDIMPORT_FIELD_MD_ALLOW_UNSAFE_LINKS_LABEL="Allow Unsafe Links"
COM_MDIMPORT_FIELD_MD_ALLOW_UNSAFE_LINKS_DESC="Allow links and images using javascript:, vbscript:, file: and data:."
COM_MDIMPORT_FIELD_MD_MAX_NESTING_LEVEL_LABEL="Maximum Nesting Level"
COM_MDIMPORT_FIELD_MD_MAX_NESTING_LEVEL_DESC="How deeply blocks may be nested. 0 means no limit."
COM_MDIMPORT_FIELD_MD_EXTENSIONS_LABEL="Extensions"
COM_MDIMPORT_FIELD_MD_EXTENSIONS_DESC="Extra CommonMark extensions. Autolink, Strikethrough, Table and Task List are already part of GitHub-Flavoured Markdown."
COM_MDIMPORT_EXTENSION_ATTRIBUTES="Attributes"
COM_MDIMPORT_EXTENSION_AUTOLINK="Autolink"
COM_MDIMPORT_EXTENSION_DESCRIPTION_LIST="Description Lists"
COM_MDIMPORT_EXTENSION_EXTERNAL_LINK="External Links (open in a new window)"
COM_MDIMPORT_EXTENSION_FOOTNOTE="Footnotes"
COM_MDIMPORT_EXTENSION_HEADING_PERMALINK="Heading Permalinks"
COM_MDIMPORT_EXTENSION_SMART_PUNCT="Smart Punctuation"
COM_MDIMPORT_EXTENSION_STRIKETHROUGH="Strikethrough"
COM_MDIMPORT_EXTENSION_TABLE="Tables"
COM_MDIMPORT_EXTENSION_TABLE_OF_CONTENTS="Table of Contents"
COM_MDIMPORT_EXTENSION_TASK_LIST="Task Lists"

; The screen
COM_MDIMPORT_WHAT_HEADING="Import the Joomla Help"
COM_MDIMPORT_WHAT_TEXT="Downloads the help pages, converts each one from Markdown to an article, copies the screenshots and builds a menu of the whole manual. Importing again updates what was imported before instead of making copies. Change any of this under Options."
COM_MDIMPORT_SUMMARY_SOURCE="Source"
COM_MDIMPORT_SUMMARY_IMAGES="Images"
COM_MDIMPORT_SUMMARY_SECTION_CATEGORIES="with a subcategory per section"
COM_MDIMPORT_SUMMARY_CONVERSION="Conversion"
COM_MDIMPORT_NOT_SET="not set"
