COM_MDIMPORT_STATUS_SECTIONS="Sections imported"
COM_MDIMPORT_STATUS_LAST="Last import"
COM_MDIMPORT_LICENCE_HEADING="Licence"
COM_MDIMPORT_LICENCE_TEXT="The help pages are published under the <a href=\"https://guide.joomla.org/contributors/jedl-license\" target=\"_blank\" rel=\"noopener\">Joomla! Electronic Documentation License (JEDL)</a>, which allows them to be republished. Keep the source line on, or otherwise say where they come from."
COM_MDIMPORT_HELP_CATEGORY_TITLE="Help"
